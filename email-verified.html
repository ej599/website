<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>Email verified successfully — Daya</title>
  <style>
    :root { color-scheme:light; --ink:#111; --muted:#666; --line:#e8e8e8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#fff; color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(100%,440px); text-align:center; padding:42px 28px; }
    .mark { display:grid; place-items:center; width:72px; height:72px; margin:0 auto 28px; border:1px solid #dedede; border-radius:50%; background:#fafafa; }
    .mark svg { width:30px; height:30px; }
    .eyebrow { margin:0 0 14px; color:#777; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(32px,7vw,42px); line-height:1.08; letter-spacing:-.055em; }
    .message { margin:18px auto 0; max-width:350px; color:var(--muted); font-size:15px; line-height:1.8; }
    .rule { width:44px; height:3px; margin:30px auto 0; background:#111; }
    .brand { margin:42px 0 0; color:#888; font-size:12px; }
    @media (max-width:480px) { main { padding:30px 8px; } }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7" /></svg>
    </div>
    <p class="eyebrow">Daya account security</p>
    <h1 id="page-title">Email verified successfully</h1>
    <p class="message">Your email address has been confirmed. You can now return to the Daya app and continue.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="brand">Daya · A Hive Labs product</p>
  </main>
</body>
</html>
